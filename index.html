<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>macOS WebOS</title>
    <link rel="stylesheet" href="css/main.css" />
  </head>
  <body>
    <div id="desktop">
      <canvas id="desktop-background" aria-hidden="true"></canvas>
      <div id="menu-bar" role="menubar"></div>
      <div id="mission-control" hidden></div>
      <div id="window-layer" aria-live="polite"></div>
      <div id="dock" role="navigation" aria-label="Dock"></div>
      <div id="notifications" aria-live="assertive"></div>
      <div id="dialogs"></div>
    </div>
    <script type="module" src="js/main.js"></script>
  </body>
</html>
